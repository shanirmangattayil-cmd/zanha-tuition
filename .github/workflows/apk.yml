name: Build Android APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build APK
        run: |
          mkdir -p apk/www && cp -r index.html manifest.json sw.js zanha.jpg icon-192.png icon-512.png videos apk/www/
          cd apk
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.ozo.zanhatuition","appName":"Zanha Tuition","webDir":"www",
           "server":{"url":"https://shanirmangattayil-cmd.github.io/zanha-tuition/","androidScheme":"https"},
           "android":{"backgroundColor":"#10264a"}}
          JSON
          npx cap add android
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
            [ -d android/app/src/main/res/mipmap-$d ] && cp www/icon-512.png android/app/src/main/res/mipmap-$d/$f.png; done; done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/ZanhaTuition.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Zanha Tuition – Android App
          body: Download ZanhaTuition.apk below and install it on Android.
          files: ZanhaTuition.apk
          make_latest: true
